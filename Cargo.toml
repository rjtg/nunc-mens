[package]
name = "nunc-mens"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Repository-local semantic memory"
repository = "https://github.com/rjtg/nunc-mens"

[[bin]]
name = "nunc"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
